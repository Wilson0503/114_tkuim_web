<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員註冊表單</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light py-4">
  <div class="container">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h3 class="text-primary fw-bold mb-3">會員註冊</h3>
        <p class="text-muted">請填寫以下資料完成註冊。</p>
        <div class="alert alert-info py-2">所有欄位皆為必填，完成後請按「註冊」送出。</div>

        <form id="signup-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">姓名</label>
            <input id="name" class="form-control" type="text" required aria-describedby="name-error">
            <p id="name-error" class="text-danger small mb-0"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control" type="email" required aria-describedby="email-error">
            <p id="email-error" class="text-danger small mb-0"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="phone">手機</label>
            <input id="phone" class="form-control" type="tel" pattern="\\d{10}" required aria-describedby="phone-error" placeholder="例如：0912345678">
            <p id="phone-error" class="text-danger small mb-0"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">密碼</label>
            <input id="password" class="form-control" type="password" minlength="8" required aria-describedby="password-error strength-text">
            <div class="progress mt-2" style="height:6px;">
              <div id="strength-level" class="progress-bar bg-danger" style="width:0;"></div>
            </div>
            <p id="strength-text" class="small mt-1"></p>
            <p id="password-error" class="text-danger small mb-0"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="confirm">確認密碼</label>
            <input id="confirm" class="form-control" type="password" required aria-describedby="confirm-error">
            <p id="confirm-error" class="text-danger small mb-0"></p>
          </div>

          <fieldset class="mb-3" id="interests">
            <legend class="form-label">興趣標籤（至少勾選一項）</legend>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" value="sport" id="chk1">
              <label class="form-check-label" for="chk1">運動</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" value="music" id="chk2">
              <label class="form-check-label" for="chk2">音樂</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" value="travel" id="chk3">
              <label class="form-check-label" for="chk3">旅遊</label>
            </div>
            <p id="interests-error" class="text-danger small mb-0"></p>
          </fieldset>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label" for="terms">我已閱讀並同意服務條款</label>
            <p id="terms-error" class="text-danger small mb-0"></p>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button id="reset-btn" type="button" class="btn btn-outline-secondary">重設</button>
            <button id="submit-btn" type="submit" class="btn btn-primary">註冊</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="signup_form.js"></script>
</body>
</html>
