<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Scroll - Jutsu</title>
    <style>
        :root {
            --scroll-bg: #f4f1ea;
            --ink-color: #333;
            --wind-color: #00A2E8;
            --lightning-color: #A349A4;
            --chakra-color: #F85B1A;
        }

        body {
            background-color: #222;
            /* Dark outside the scroll */
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: padding;
            margin: 0;
            padding: 50px;
        }

        /* The Scroll Container */
        .scroll {
            background-color: var(--scroll-bg);
            width: 100%;
            max-width: 1000px;
            padding: 50px;
            border-top: 20px solid #8b4513;
            border-bottom: 20px solid #8b4513;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--ink-color);
            padding-bottom: 20px;
            margin-bottom: 50px;
        }

        .header h2 {
            font-size: 3rem;
            color: var(--ink-color);
            margin: 0;
            text-transform: uppercase;
        }

        .btn-back {
            text-decoration: none;
            color: var(--ink-color);
            border: 2px solid var(--ink-color);
            padding: 10px 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: var(--ink-color);
            color: var(--scroll-bg);
        }

        /* Grid */
        .jutsu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
        }

        /* Cards */
        .card {
            background: #fff;
            border: 4px solid #000;
            padding: 30px;
            transition: transform 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px) rotate(2deg);
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }

        .card p {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
        }

        /* Styles for specific types */
        .card.wind {
            border-color: var(--wind-color);
            color: var(--wind-color);
        }

        .card.wind h3 {
            border-color: var(--wind-color);
        }

        .card.lightning {
            border-color: var(--lightning-color);
            color: var(--lightning-color);
        }

        .card.lightning h3 {
            border-color: var(--lightning-color);
        }

        .card.chakra {
            border-color: var(--chakra-color);
            color: var(--chakra-color);
        }

        .card.chakra h3 {
            border-color: var(--chakra-color);
        }

        /* Rank Badge */
        .rank {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #000;
            color: #fff;
            padding: 10px;
            font-weight: bold;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card.wind .rank {
            background: var(--wind-color);
        }

        .card.lightning .rank {
            background: var(--lightning-color);
        }

        .card.chakra .rank {
            background: var(--chakra-color);
        }
    </style>
</head>

<body>

    <div class="scroll">
        <div class="header">
            <h2>忍術卷軸</h2>
            <a href="index.html" class="btn-back">回到木葉</a>
        </div>

        <div class="jutsu-grid">
            <!-- Card 1 -->
            <div class="card wind">
                <div class="rank">A</div>
                <h3>螺旋丸</h3>
                <p>將查克拉集中在手上，以不規則的方向不停流動，並加以壓縮，形成手掌般大小的查克拉球。</p>
            </div>

            <!-- Card 2 -->
            <div class="card lightning">
                <div class="rank">A</div>
                <h3>千鳥</h3>
                <p>將大量的雷遁查克拉集中於手中，肉眼可見查克拉的亮光，發出有如一千隻鳥鳴叫的刺耳聲音。</p>
            </div>

            <!-- Card 3 -->
            <div class="card chakra">
                <div class="rank">B</div>
                <h3>影分身</h3>
                <p>創造出實體的分身。這不是單純的幻影，而是查克拉平分後的實體。</p>
            </div>
        </div>
    </div>

</body>

</html>
